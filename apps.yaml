# Apps watched by this F-Droid repository. metascoop fetches the latest
# GitHub Release of each repo, downloads the .apk asset, runs `fdroid update`
# and commits the fresh index. See setup.md for details.
#
# For each app the `git` URL must point to a GitHub repo whose releases
# contain exactly one .apk asset (see TASK-093 in Ahzed11/chore-app).
chore-app:
  git: https://github.com/Ahzed11/chore-app
  name: "ChoreApp"
  description: |
    Self-hosted household chore coordinator. Members join a household via
    invite link/QR, chores are auto-assigned round-robin (or manually),
    completing a chore awards fixed points, and a per-household leaderboard
    ranks members by points (all-time / this-week / this-month).

    <b>Features</b>

    - Chores with recurrence, auto-assignment and admin reassignment
    - Points + leaderboards
    - Shared grocery list
    - Invite members via QR code / deep link
    - Bring your own server (server URL configured in-app)

  # Valid category from https://f-droid.org/en/docs/Build_Metadata_Reference/#Categories
  categories:
    - Organization

# Signed with its own key: pin its certificate in signing_certs.json (check_signatures.py refuses an app without one).
betterhome:
  git: https://github.com/Ahzed11/BetterHome
  name: "BetterHome"
  summary: "Share the chores of a home fairly, with points and shared lists"
  description: |
    Mobile app for people who share a home. Recurring chores are spread
    fairly (round robin), effort is rewarded with points on a friendly
    scoreboard, and members share checklists such as the groceries.

    <b>Features</b>

    - Recurring chores with fair automatic assignment and admin reassignment
    - Points and a scoreboard per household (all-time / this month)
    - Shared checklists for groceries and more
    - Push notifications through a self-hosted Gotify server
    - Bring your own server: the server address is entered in the app

  categories:
    - Organization
