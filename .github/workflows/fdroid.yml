name: Generate F-Droid repo

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
  - cron: "45 2 * * *"

# Serialize runs: update.sh regenerates the index, commits and pushes back to
# this repo, so two concurrent runs (e.g. a push near the scheduled time) would
# race on the push and one would fail with "failed to push some refs".
concurrency:
  group: fdroid-repo-update
  cancel-in-progress: false

jobs:
  apps:
    name: "Generate repo from apps listing"
    runs-on: ubuntu-latest

    # update.sh commits the regenerated index and pushes it back to this
    # repo, so GITHUB_TOKEN needs write access (repo default is read-only).
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Create basic directory structure
        run: mkdir -p fdroid/repo

      - name: Restore correct mtime
        run: |
          sudo apt install git-restore-mtime
          git restore-mtime

      - name: Install F-Droid server software
        run: |
         sudo add-apt-repository ppa:fdroid/fdroidserver
         sudo apt-get update
         sudo apt-get install fdroidserver

      - name: Set up repo secrets
        run: |
          echo "${{ secrets.KEYSTORE_P12 }}" | base64 -d - > fdroid/keystore.p12
          echo "${{ secrets.CONFIG_YML }}" | base64 -d - > fdroid/config.yml

      - uses: actions/setup-go@v5
        name: Set up Go
        with:
          go-version: '^1.17.0'

      - name: Run update script
        run: bash update.sh 2>&1
        env:
          GH_ACCESS_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
